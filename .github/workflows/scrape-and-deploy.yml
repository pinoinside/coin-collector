name: Automatic Coin Scraping & Build

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa Dipendenze
        run: |
          pip install requests beautifulsoup4

      - name: Esegui lo Scraper
        run: |
          python scraper.py

      - name: Commit e Push del catalog.json aggiornato
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Verifica se il file esiste prima di fare git add
          if [ -f "public/catalog.json" ]; then
            git add public/catalog.json
            
            if ! git diff --staged --quiet; then
              git commit -m "chore: aggiornamento automatico catalogo monete"
              git push
            else
              echo "Nessuna modifica rilevata nel catalogo."
            fi
          else
            echo "ERRORE: Il file public/catalog.json non esiste!"
            exit 1
          fi
