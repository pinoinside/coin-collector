name: Automatic Coin Scraping & Build

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa Dipendenze
        run: |
          pip install requests beautifulsoup4

      - name: Esegui lo Scraper
        run: |
          python scraper.py

      - name: Commit e Push del catalogo ed immagini
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Verifica se il file catalogo esiste
          if [ -f "public/catalog.json" ]; then
            git add public/catalog.json
            
            # Aggiunge anche la cartella immagini se esiste
            if [ -d "public/images" ]; then
              git add public/images/
            fi
            
            if ! git diff --staged --quiet; then
              # Calcola quante immagini nuove o modificate sono state aggiunte
              NEW_IMAGES=$(git diff --staged --name-only | grep "^public/images/" | wc -l)
              
              echo "Trovate modifiche da committare!"
              echo " - Catalogo aggiornato"
              echo " - Immagini nuove/aggiornate: $NEW_IMAGES"
              
              git commit -m "chore: aggiornamento automatico catalogo e immagini monete ($NEW_IMAGES nuove immagini)"
              git push
              echo "Push completato con successo!"
            else
              echo "Nessuna modifica rilevata nel catalogo o nelle immagini."
            fi
          else
            echo "ERRORE: Il file public/catalog.json non esiste!"
            exit 1
          fi
