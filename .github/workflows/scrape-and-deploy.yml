name: Automatic Coin Scraping & Build

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

# 1. ESPLICITIAMO I PERMESSI DI SCRITTURA NEL WORKFLOW
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # 2. DIAMO IL TOKEN DI AUTENTICAZIONE A CHECKOUT
      - name: Checkout Codice
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa Dipendenze
        run: |
          pip install requests beautifulsoup4

      - name: Esegui lo Scraper
        run: |
          python scraper.py

      - name: Commit e Push del catalog.json aggiornato
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p public
          git add public/catalog.json
          
          # Se ci sono modifiche fa il commit e push, altrimenti passa oltre senza fallire
          if ! git diff --staged --quiet; then
            git commit -m "chore: aggiornamento automatico catalogo monete"
            git push
          else
            echo "Nessuna modifica rilevata nel catalogo."
          fi
